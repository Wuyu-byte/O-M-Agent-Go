# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

ds_think_chat_model:
  api_key: "ark-3d70d987-506d-4687-8225-63661b065da4-262d5"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

ds_quick_chat_model:
  api_key: "ark-3d70d987-506d-4687-8225-63661b065da4-262d5"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

doubao_embedding_model:
  api_key: "sk-46b1d0b726aa468292b0b77dc4610aa2"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "text-embedding-v4"

file_dir: "E:/GO-Agent/internal/ai/cmd/knowledge_cmd/docs"
lab_log_dir: "E:/GO-Agent/logs"

log_mcp_enabled: false
mcp_url: "http://localhost:3000/sse"

# arXiv MCP: https://github.com/blazickjp/arxiv-mcp-server
# Set arxiv_mcp_enabled to true after installing uv and arxiv-mcp-server.
arxiv_mcp_enabled: true
arxiv_mcp_command: "uv"
arxiv_mcp_args:
  - "tool"
  - "run"
  - "arxiv-mcp-server"
  - "--storage-path"
  - "E:/GO-Agent/arxiv-papers"
